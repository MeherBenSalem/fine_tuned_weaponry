plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")
    config("${mod_id}.mixins.json")
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            ideName = "Forge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = project.mkdir(project.file('runs/client'))
            if (System.getenv('RUNEBORN_UITEST')) {
                programArguments.addAll('--quickPlaySingleplayer', 'uitest', '--width', '1280', '--height', '720')
            }
        }
        server {
            server()
            gameDirectory = project.mkdir(project.file('runs/server'))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly project(':common')
    annotationProcessor('org.spongepowered:mixin:0.8.5-SNAPSHOT:processor')
}

jar {
    finalizedBy('reobfJar')
    manifest.attributes([
            'MixinConfigs': "${mod_id}.mixins.json"
    ])
}
