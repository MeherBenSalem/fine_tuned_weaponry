plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

// Version-independent code and assets shared by every Minecraft version.
sourceSets.main.java.srcDirs += [rootProject.file('../../core/src/main/java'), rootProject.file('../../shared/src/main/java')]
sourceSets.main.resources.srcDirs += [rootProject.file('../../shared/src/main/resources'), file('src/generated/resources')]

neoForge {
    neoFormVersion = neo_form_version
    accessTransformers.from(file('accesstransformer.cfg').absolutePath)
}

dependencies {
    // Fabric and NeoForge both bundle Fabric Mixin and MixinExtras.
    compileOnly('net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7')
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.3'))
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    sourceSets.main.java.sourceDirectories.each { commonJava it }
    sourceSets.main.resources.sourceDirectories.each { commonResources it }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
