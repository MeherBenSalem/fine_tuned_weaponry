name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

defaults:
  run:
    working-directory: 1.20.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Forge
        run: ./gradlew :forge:build --no-daemon

      - name: Build Fabric
        run: ./gradlew :fabric:build --no-daemon

      - name: Upload Forge artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-jar
          path: 1.20.1/forge/build/libs/*.jar
          if-no-files-found: error

      - name: Upload Fabric artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabric-jar
          path: 1.20.1/fabric/build/libs/*.jar
          if-no-files-found: error
