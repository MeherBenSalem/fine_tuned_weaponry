name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

defaults:
  run:
    working-directory: 26.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Fabric
        run: ./gradlew :fabric:build --no-daemon

      - name: Build NeoForge
        run: ./gradlew :neoforge:build --no-daemon

      - name: Upload Fabric artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabric-jar
          path: 26.2/fabric/build/libs/*.jar
          if-no-files-found: error

      - name: Upload NeoForge artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-jar
          path: 26.2/neoforge/build/libs/*.jar
          if-no-files-found: error
