# Publish Runeborn to Modrinth + CurseForge on version tags.
#
# Secrets: MODRINTH_TOKEN, CURSEFORGE_TOKEN, CURSEFORGE_API_KEY
# Variables: MODRINTH_ID, CURSEFORGE_ID
#
# Usage: git tag v3.0.0 && git push origin v3.0.0
# Builds 8 jars: Forge + Fabric for 1.20.1, NeoForge + Fabric for 1.21.1, 26.2 and 26.3.
# Re-running is safe: files that already exist with the same hash are skipped.

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging
        required: false
      dry_run:
        description: Build and verify only, upload nothing
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - mc: '1.20.1'
            java: '17'
            gradle_java: '21'
            tasks: ':forge:build :fabric:build'
          - mc: '1.21.1'
            java: '21'
            gradle_java: '21'
            tasks: ':neoforge:build :fabric:build'
          - mc: '26.2'
            java: '25'
            gradle_java: '25'
            tasks: ':neoforge:build :fabric:build'
          - mc: '26.3'
            java: '25'
            gradle_java: '25'
            tasks: ':neoforge:build :fabric:build'
    defaults:
      run:
        working-directory: versions/${{ matrix.mc }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            ${{ matrix.gradle_java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew ${{ matrix.tasks }} --no-daemon \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.mc }}
          path: |
            versions/${{ matrix.mc }}/*/build/libs/runeborn-*.jar
            !versions/${{ matrix.mc }}/*/build/libs/*-sources.jar
            !versions/${{ matrix.mc }}/common/build/libs/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: jars-*
          path: dist
          merge-multiple: true

      - name: Check release jars
        id: jars
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mapfile -t JARS < <(find dist -type f -name "runeborn-*-${VERSION}.jar" | sort)
          printf '%s\n' "${JARS[@]}"
          if [ ${#JARS[@]} -ne 8 ]; then
            echo "Expected 8 release jars for ${VERSION}, found ${#JARS[@]} (does gradle.properties match the tag?)" >&2
            exit 1
          fi
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "list<<$EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Preserve exact release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runeborn-${{ steps.ver.outputs.version }}
          path: dist/runeborn-*-${{ steps.ver.outputs.version }}.jar
          if-no-files-found: error

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upload Modrinth + CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_LIST: ${{ steps.jars.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODRINTH_ID:-}" && test -n "${CURSEFORGE_ID:-}"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const version = process.env.VERSION;
          const jars = process.env.JAR_LIST.split(/\n/).map(s => s.trim()).filter(Boolean);

          // Release notes: patchnotes/<version>.md, else the changelog.
          const notes = [`patchnotes/${version}.md`, 'CHANGELOG.md'].find((f) => fs.existsSync(f));
          const changelog = notes ? fs.readFileSync(notes, 'utf8') : `Release ${version}`;
          const CF_LOADER_IDS = { fabric: 7499, forge: 7498, neoforge: 10150 };
          // Fabric builds need Fabric API; Forge and NeoForge builds have no dependencies.
          const MODRINTH_FABRIC_API = 'P7dR8mSH';
          const CF_FABRIC_API = 306612;

          function detect(jar) {
            const m = path.basename(jar).match(/^runeborn-(fabric|forge|neoforge)-(\d+\.\d+(?:\.\d+)?)-(.+)\.jar$/);
            if (!m || m[3] !== version) throw new Error('Unexpected release artifact: ' + jar);
            return { loader: m[1], gv: m[2] };
          }
          const hash = (jar, algorithm) => crypto.createHash(algorithm).update(fs.readFileSync(jar)).digest('hex');

          function flattenVersions(payload) {
            const data = payload?.data ?? payload;
            const flat = [];
            if (!Array.isArray(data)) return flat;
            for (const entry of data) {
              if (Array.isArray(entry?.versions)) flat.push(...entry.versions);
              else if (entry?.id != null && entry?.name) flat.push(entry);
            }
            return flat;
          }
          function findVersionId(flat, name) {
            const lower = String(name).toLowerCase();
            return (flat.find(v => v.name === name || v.slug === name)
              ?? flat.find(v => String(v.name).toLowerCase() === lower))?.id;
          }

          (async () => {
            const seen = new Set();
            for (const jar of jars) {
              const { loader, gv } = detect(jar);
              if (seen.has(loader + gv)) throw new Error('Duplicate artifact for ' + loader + ' ' + gv);
              seen.add(loader + gv);
            }

            // ---- Modrinth
            const listRes = await fetch(`https://api.modrinth.com/v2/project/${process.env.MODRINTH_ID}/version`,
              { headers: { Authorization: process.env.MODRINTH_TOKEN } });
            if (!listRes.ok) throw new Error('Modrinth preflight ' + listRes.status);
            const existingMr = new Map((await listRes.json()).map(v => [v.version_number, v]));
            for (const jar of jars) {
              const { loader, gv } = detect(jar);
              const versionNumber = `${version}+${loader}-${gv}`;
              const existing = existingMr.get(versionNumber);
              if (existing) {
                if (!existing.files.some(f => f.primary && f.hashes.sha1 === hash(jar, 'sha1'))) {
                  throw new Error('Existing Modrinth version differs; inspect before retry: ' + versionNumber);
                }
                console.log('Modrinth skip (verified exists)', existing.id, versionNumber);
                continue;
              }
              const body = {
                name: `Runeborn ${version} · ${loader} · ${gv}`,
                version_number: versionNumber,
                changelog,
                dependencies: loader === 'fabric'
                  ? [{ project_id: MODRINTH_FABRIC_API, dependency_type: 'required' }] : [],
                game_versions: [gv],
                version_type: 'release',
                loaders: [loader],
                featured: false,
                status: 'listed',
                project_id: process.env.MODRINTH_ID,
                file_parts: ['file_0'],
                primary_file: 'file_0',
              };
              const form = new FormData();
              form.append('data', JSON.stringify(body));
              form.append('file_0', new Blob([fs.readFileSync(jar)]), path.basename(jar));
              const res = await fetch('https://api.modrinth.com/v2/version', {
                method: 'POST', headers: { Authorization: process.env.MODRINTH_TOKEN }, body: form,
              });
              const text = await res.text();
              if (!res.ok) throw new Error('Modrinth ' + res.status + ' ' + text.slice(0, 500));
              console.log('Modrinth OK', JSON.parse(text).id, versionNumber, 'sha256=' + hash(jar, 'sha256'));
            }

            // ---- CurseForge
            const existingCf = new Map();
            for (let index = 0; ; index += 50) {
              const res = await fetch(`https://api.curseforge.com/v1/mods/${process.env.CURSEFORGE_ID}/files?pageSize=50&index=${index}`,
                { headers: { 'x-api-key': process.env.CURSEFORGE_API_KEY } });
              if (!res.ok) throw new Error('CurseForge preflight ' + res.status);
              const page = await res.json();
              for (const file of page.data) existingCf.set(file.fileName, file);
              if (index + page.data.length >= page.pagination.totalCount || !page.data.length) break;
            }
            let flat = [];
            const gvRes = await fetch('https://minecraft.curseforge.com/api/game/versions',
              { headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN } });
            if (gvRes.ok) flat = flattenVersions(await gvRes.json());
            if (!flat.length) throw new Error('No CurseForge game versions resolved');

            for (const jar of jars) {
              const { loader, gv } = detect(jar);
              const existing = existingCf.get(path.basename(jar));
              if (existing) {
                if (!existing.hashes.some(h => h.algo === 1 && h.value === hash(jar, 'sha1'))) {
                  throw new Error('Existing CurseForge file differs; inspect before retry: ' + existing.id);
                }
                console.log('CurseForge skip (verified exists)', existing.id, path.basename(jar));
                continue;
              }
              const mcId = findVersionId(flat, gv);
              if (mcId == null) throw new Error('No CurseForge game version id for ' + gv);
              const gameVersions = [mcId, CF_LOADER_IDS[loader]];
              for (const side of ['Client', 'Server']) {
                const id = findVersionId(flat, side);
                if (id != null) gameVersions.push(id);
              }
              const meta = {
                changelog,
                changelogType: 'markdown',
                displayName: `Runeborn ${version} · ${loader} · ${gv}`,
                gameVersions,
                releaseType: 'release',
              };
              if (loader === 'fabric') {
                meta.relations = { projects: [{ slug: 'fabric-api', projectID: CF_FABRIC_API, type: 'requiredDependency' }] };
              }
              const form = new FormData();
              form.append('metadata', JSON.stringify(meta));
              form.append('file', new Blob([fs.readFileSync(jar)]), path.basename(jar));
              const res = await fetch(`https://minecraft.curseforge.com/api/projects/${process.env.CURSEFORGE_ID}/upload-file`,
                { method: 'POST', headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN }, body: form });
              const text = await res.text();
              if (!res.ok) throw new Error('CurseForge ' + res.status + ' ' + text.slice(0, 500));
              console.log('CurseForge OK', JSON.parse(text).id, meta.displayName, 'sha256=' + hash(jar, 'sha256'));
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
