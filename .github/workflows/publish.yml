# Publish Fine Tuned Weaponry to Modrinth + CurseForge on version tags.
#
# Secrets: MODRINTH_TOKEN, CURSEFORGE_TOKEN, CURSEFORGE_API_KEY
# Variables: MODRINTH_ID, CURSEFORGE_ID
#
# Usage: git tag v2.3.0 && git push origin v2.3.0

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging
        required: false
      legacy_only:
        description: Build/upload only 1.20.1 jars (skip 1.21.1 re-upload)
        required: false
        default: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build 26.2 workspace (1.21.1)
        if: ${{ inputs.legacy_only != 'true' }}
        working-directory: 26.2
        run: |
          chmod +x gradlew
          ./gradlew :fabric:build :neoforge:build --no-daemon

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build 1.20.1 workspace
        working-directory: 1.20.1
        run: |
          chmod +x gradlew
          ./gradlew :forge:build :fabric:build --no-daemon

      - name: Find release jars
        id: jars
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          SEARCH_PATHS=(1.20.1)
          if [[ "${{ inputs.legacy_only }}" != "true" ]]; then
            SEARCH_PATHS=(26.2 "${SEARCH_PATHS[@]}")
          fi
          mapfile -t JARS < <(find "${SEARCH_PATHS[@]}" -type f -path "*/build/libs/*-${VERSION}.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
            ! -name "*-dev.jar" ! -name "*-dev-shadow.jar" \
            ! -path "*/common/build/*" | sort)
          FILTERED=()
          for j in "${JARS[@]}"; do
            size=$(stat -c%s "$j" 2>/dev/null || stat -f%z "$j")
            if [ "$size" -lt 1024 ]; then
              echo "Skipping tiny jar ($size bytes): $j" >&2
              continue
            fi
            FILTERED+=("$j")
          done
          JARS=("${FILTERED[@]}")
          if [ ${#JARS[@]} -eq 0 ]; then
            echo "No release jars found for version ${VERSION}" >&2
            exit 1
          fi
          printf '%s\n' "${JARS[@]}"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "list<<$EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Preserve exact release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fine-tuned-weaponry-${{ steps.ver.outputs.version }}
          path: ${{ steps.jars.outputs.list }}
          if-no-files-found: error

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upload Modrinth + CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_LIST: ${{ steps.jars.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODRINTH_ID:-}" && test -n "${CURSEFORGE_ID:-}"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const version = process.env.VERSION;
          const jars = process.env.JAR_LIST.split(/\n/).map(s => s.trim()).filter(Boolean);
          if (!jars.length) throw new Error('No jars to upload');

          function resolveChangelog(ver) {
            for (const f of ['CHANGELOG.md', `PATCH_NOTES.md`, `${ver}-patchnotes.md`]) {
              if (fs.existsSync(f)) return fs.readFileSync(f, 'utf8');
            }
            return `Release ${ver}`;
          }
          const changelog = resolveChangelog(version);

          const LOADER_IDS = { fabric: 7499, forge: 7498, neoforge: 10150, quilt: 9153 };
          // Match the existing build pins; do not silently select another game/loader.
          const JAUML_VERSIONS = {
            'neoforge-1.21.1': 'a1yuBbgk',
            'fabric-1.21.1': 'qhE3mjqW',
            'forge-1.20.1': 'LDZdiuuA',
            'fabric-1.20.1': 'echba2hV',
          };

          function detect(jar) {
            const n = path.basename(jar).toLowerCase();
            const p = jar.replace(/\\/g, '/').toLowerCase();
            let loader = null;
            if (n.includes('neoforge') || p.includes('/neoforge/')) loader = 'neoforge';
            else if (n.includes('fabric') || p.includes('/fabric/')) loader = 'fabric';
            else if ((n.includes('forge') && !n.includes('neoforge')) || p.includes('/forge/')) loader = 'forge';
            else loader = 'fabric';
            const m = n.match(/(?:^|-)(1\.\d+(?:\.\d+)?)(?:-|$)/) || p.match(/1\.\d+(?:\.\d+)?/);
            const gv = m ? (m[1] || m[0]) : (p.includes('1.20.1') ? '1.20.1' : '1.21.1');
            return { loader, gv };
          }

          function flattenVersions(payload) {
            const flat = [];
            const data = payload?.data ?? payload;
            if (!Array.isArray(data)) return flat;
            for (const entry of data) {
              if (Array.isArray(entry?.versions)) {
                for (const v of entry.versions) flat.push(v);
              } else if (entry?.id != null && entry?.name) {
                flat.push(entry);
              }
            }
            return flat;
          }

          function findVersionId(flat, name) {
            const exact = flat.find((v) => v.name === name || v.slug === name);
            if (exact) return exact.id;
            return flat.find((v) => String(v.name).toLowerCase() === String(name).toLowerCase())?.id;
          }

          (async () => {
            const hash = (jar, algorithm) => crypto.createHash(algorithm).update(fs.readFileSync(jar)).digest('hex');
            const targets = new Set();
            for (const jar of jars) {
              const { loader, gv } = detect(jar);
              const target = `${loader}-${gv}`;
              if (!JAUML_VERSIONS[target] || targets.has(target) || path.basename(jar) !== `fine_tuned_weaponry-${target}-${version}.jar`) {
                throw new Error('Unexpected or duplicate release artifact: ' + jar);
              }
              targets.add(target);
            }
            const listRes = await fetch(
              `https://api.modrinth.com/v2/project/${process.env.MODRINTH_ID}/version`,
              { headers: { Authorization: process.env.MODRINTH_TOKEN } },
            );
            if (!listRes.ok) throw new Error('Modrinth preflight ' + listRes.status);
            const existingMr = new Map((await listRes.json()).map(v => [v.version_number, v]));
            const existingCf = new Map();
            for (let index = 0; ; index += 50) {
              const cfList = await fetch(`https://api.curseforge.com/v1/mods/${process.env.CURSEFORGE_ID}/files?pageSize=50&index=${index}`, {
                headers: { 'x-api-key': process.env.CURSEFORGE_API_KEY },
              });
              if (!cfList.ok) throw new Error('CurseForge preflight ' + cfList.status);
              const page = await cfList.json();
              for (const file of page.data) existingCf.set(file.fileName, file);
              if (index + page.data.length >= page.pagination.totalCount) break;
              if (!page.data.length) throw new Error('Incomplete CurseForge file listing');
            }

            for (const jar of jars) {
              const { loader, gv } = detect(jar);
              const versionNumber = `${version}+${loader}-${gv}`;
              if (existingMr.has(versionNumber)) {
                const existing = existingMr.get(versionNumber);
                if (!existing.files.some(f => f.primary && f.filename === path.basename(jar) && f.hashes.sha1 === hash(jar, 'sha1')) ||
                    !existing.dependencies.some(d => d.version_id === JAUML_VERSIONS[`${loader}-${gv}`] && d.dependency_type === 'required')) {
                  throw new Error('Existing Modrinth version differs; inspect before retry: ' + versionNumber);
                }
                console.log('Modrinth skip (verified exists)', existing.id, versionNumber);
                continue;
              }
              const body = {
                name: `${version} · ${loader} · ${gv}`,
                version_number: versionNumber,
                changelog,
                dependencies: [{
                  project_id: 'ihvBalM2',
                  version_id: JAUML_VERSIONS[`${loader}-${gv}`],
                  dependency_type: 'required',
                }],
                game_versions: [gv],
                version_type: 'release',
                loaders: [loader],
                featured: false,
                status: 'listed',
                project_id: process.env.MODRINTH_ID,
                file_parts: ['file_0'],
                primary_file: 'file_0',
              };
              const form = new FormData();
              form.append('data', JSON.stringify(body));
              form.append('file_0', new Blob([fs.readFileSync(jar)]), path.basename(jar));
              const mrRes = await fetch('https://api.modrinth.com/v2/version', {
                method: 'POST',
                headers: { Authorization: process.env.MODRINTH_TOKEN },
                body: form,
              });
              const mrText = await mrRes.text();
              if (!mrRes.ok) throw new Error('Modrinth ' + mrRes.status + ' ' + mrText.slice(0, 500));
              const mrReceipt = JSON.parse(mrText);
              if (!mrReceipt.id) throw new Error('Modrinth upload returned no version id');
              console.log('Modrinth OK', mrReceipt.id, body.version_number, path.basename(jar), 'sha256=' + hash(jar, 'sha256'));
            }

            let flat = [];
            const uploadGv = await fetch('https://minecraft.curseforge.com/api/game/versions', {
              headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN },
            });
            if (uploadGv.ok) flat = flattenVersions(await uploadGv.json());
            if (!flat.length) {
              const gvRes = await fetch('https://api.curseforge.com/v1/games/432/versions', {
                headers: { 'x-api-key': process.env.CURSEFORGE_API_KEY },
              });
              flat = flattenVersions(JSON.parse(await gvRes.text()));
            }
            if (!flat.length) throw new Error('No CurseForge game versions resolved');

            for (const jar of jars) {
              const { loader, gv } = detect(jar);
              const existing = existingCf.get(path.basename(jar));
              if (existing) {
                if (!existing.hashes.some(h => h.algo === 1 && h.value === hash(jar, 'sha1')) ||
                    !existing.dependencies.some(d => d.modId === 1281310 && d.relationType === 3)) {
                  throw new Error('Existing CurseForge file differs; inspect before retry: ' + existing.id);
                }
                console.log('CurseForge skip (verified exists)', existing.id, path.basename(jar));
                continue;
              }
              const mcId = findVersionId(flat, gv);
              const loaderId = LOADER_IDS[loader];
              const clientId = findVersionId(flat, 'Client');
              const serverId = findVersionId(flat, 'Server');
              if (mcId == null) throw new Error('No CurseForge game version id for ' + gv);
              const gameVersions = [mcId];
              if (loaderId != null) gameVersions.push(loaderId);
              if (clientId != null) gameVersions.push(clientId);
              if (serverId != null) gameVersions.push(serverId);
              const meta = {
                changelog,
                changelogType: 'markdown',
                displayName: `${version} · ${loader} · ${gv}`,
                gameVersions,
                releaseType: 'release',
                relations: { projects: [{ slug: 'jauml', projectID: 1281310, type: 'requiredDependency' }] },
              };
              const cfForm = new FormData();
              cfForm.append('metadata', JSON.stringify(meta));
              cfForm.append('file', new Blob([fs.readFileSync(jar)]), path.basename(jar));
              const cfRes = await fetch(
                `https://minecraft.curseforge.com/api/projects/${process.env.CURSEFORGE_ID}/upload-file`,
                { method: 'POST', headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN }, body: cfForm },
              );
              const cfText = await cfRes.text();
              if (!cfRes.ok) throw new Error('CurseForge ' + cfRes.status + ' ' + cfText.slice(0, 500));
              const cfReceipt = JSON.parse(cfText);
              if (!cfReceipt.id) throw new Error('CurseForge upload returned no file id');
              console.log('CurseForge OK', cfReceipt.id, meta.displayName, path.basename(jar), 'sha256=' + hash(jar, 'sha256'));
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
